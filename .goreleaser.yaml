version: 2

project_name: gf

before:
  hooks:
    - go mod tidy

builds:
  - id: gf
    main: ./cmd/gf
    binary: gf
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: aoyamashou
    name: goFinder-TUI
